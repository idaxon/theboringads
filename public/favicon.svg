<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    :root {
      --head-fill: #0A0A0A;
      --head-stroke: transparent;
      --head-stroke-width: 0px;
      --tuft-stroke: #0A0A0A;
      --eye-sclera: #FFFFFF;
      --eye-pupil: #0A0A0A;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --head-fill: #0A0A0A;
        --head-stroke: #DFFF00;
        --head-stroke-width: 3.5px;
        --tuft-stroke: #DFFF00;
        --eye-sclera: #FFFFFF;
        --eye-pupil: #0A0A0A;
      }
    }
  </style>

  <!-- Hair Tuft / Spikes on upper right -->
  <line x1="66" y1="36" x2="72" y2="10" stroke="var(--tuft-stroke)" stroke-width="5" stroke-linecap="round" />
  <line x1="76" y1="44" x2="90" y2="20" stroke="var(--tuft-stroke)" stroke-width="5" stroke-linecap="round" />

  <!-- Mascot Face Head (Solid Circle with dark-mode responsive contour) -->
  <circle cx="48" cy="58" r="34" fill="var(--head-fill)" stroke="var(--head-stroke)" stroke-width="var(--head-stroke-width)" />

  <!-- Left Eye Sclera (White half-circle with flat horizontal eyelid) -->
  <path d="M 23.5 56 H 42.5 C 42.5 68 23.5 68 23.5 56 Z" fill="var(--eye-sclera)" />
  <!-- Left Pupil (Dark bored half-circle under eyelid) -->
  <path d="M 31 56 H 39 C 39 61.5 31 61.5 31 56 Z" fill="var(--eye-pupil)" />

  <!-- Right Eye Sclera -->
  <path d="M 48.5 56 H 67.5 C 67.5 68 48.5 68 48.5 56 Z" fill="var(--eye-sclera)" />
  <!-- Right Pupil -->
  <path d="M 56 56 H 64 C 64 61.5 56 61.5 56 56 Z" fill="var(--eye-pupil)" />
</svg>

